services:
  - type: web
    name: tri-buddy-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: tri_buddy
      - key: DB_CONNECT_TIMEOUT
        value: 5
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: meta-llama/llama-3.1-70b-instruct,nvidia/nemotron-3-ultra-550b-a55b:free,qwen/qwen3.8-27b:free,apodex/apodex-1.1-mini:free
      - key: OPENROUTER_TIMEOUT
        value: 25
      - key: OPENROUTER_VISION_MODELS
        value: qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free,openrouter/free
      - key: HEALTH_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SLACK_LEAD_CHANNEL
        value: lead_hub
      - key: SLACK_DEV_CHANNEL
        value: byabosayee_devs
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
